name: Rotate SeatGate default logins

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seatgate-credential-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix server
      - name: Rotate application logins without resetting classroom data
        run: node server/rotate-logins.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEATGATE_ROTATION: ${{ secrets.SEATGATE_ROTATION }}
