name: Initialize Database

run-name: Initialize database by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INITIALIZE to confirm this is a new, blank database
        required: true
        type: string

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm initialization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "INITIALIZE" ]; then
            echo "::error::Confirmation must be exactly INITIALIZE."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Initialize blank database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: node server/initialize.js
